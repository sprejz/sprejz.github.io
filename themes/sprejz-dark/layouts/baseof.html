<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}{{ if ne .Title .Site.Title }} - {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Site.Params.description }}">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
    <div class="matrix-bg">
        <svg viewBox="0 0 400 800" preserveAspectRatio="none">
            <defs>
                <linearGradient id="neonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0" />
                    <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
                </linearGradient>
            </defs>
            <!-- Grid background -->
            <g class="grid">
                <line class="grid-line" x1="0" y1="0" x2="400" y2="0" />
                <line class="grid-line" x1="0" y1="50" x2="400" y2="50" />
                <line class="grid-line" x1="0" y1="100" x2="400" y2="100" />
                <line class="grid-line" x1="0" y1="150" x2="400" y2="150" />
                <line class="grid-line" x1="0" y1="200" x2="400" y2="200" />
                <line class="grid-line" x1="0" y1="250" x2="400" y2="250" />
                <line class="grid-line" x1="0" y1="300" x2="400" y2="300" />
                <line class="grid-line" x1="0" y1="350" x2="400" y2="350" />
                <line class="grid-line" x1="0" y1="400" x2="400" y2="400" />
                <line class="grid-line" x1="0" y1="450" x2="400" y2="450" />
                <line class="grid-line" x1="0" y1="500" x2="400" y2="500" />
                <line class="grid-line" x1="0" y1="550" x2="400" y2="550" />
                <line class="grid-line" x1="0" y1="600" x2="400" y2="600" />
                <line class="grid-line" x1="0" y1="650" x2="400" y2="650" />
                <line class="grid-line" x1="0" y1="700" x2="400" y2="700" />
                <line class="grid-line" x1="0" y1="750" x2="400" y2="750" />
            </g>
            <!-- Data flow lines -->
            <path class="data-line" d="M 50 0 Q 100 200, 80 800" />
            <path class="data-line" d="M 150 0 Q 200 200, 180 800" />
            <path class="data-line" d="M 250 0 Q 300 200, 280 800" />
            <path class="data-line" d="M 350 0 Q 380 200, 360 800" />
            <!-- Geometric shapes -->
            <circle cx="200" cy="100" r="30" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3" />
            <circle cx="150" cy="300" r="40" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.2" />
            <circle cx="300" cy="500" r="35" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3" />
            <rect x="80" y="200" width="60" height="60" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.2" transform="rotate(45 110 230)" />
            <rect x="250" y="400" width="80" height="80" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.15" transform="rotate(30 290 440)" />
        </svg>
    </div>

    <header>
        <div class="container">
            <nav>
                <div class="logo">Hendrik</div>
                <ul class="nav-menu">
                    <li><a href="#about">Über mich</a></li>
                    <li><a href="#projects">Projekte</a></li>
                    <li><a href="#triathlon">Triathlon</a></li>
                    <li><a href="#contact">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container main-content">
        {{ block "main" . }}{{ end }}
    </div>

    <footer>
        <div class="container">
            <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. Alle Rechte vorbehalten.</p>
        </div>
    </footer>
</body>
</html>
